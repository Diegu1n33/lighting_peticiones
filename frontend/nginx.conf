map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API y WebSocket -> FastAPI
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Sobrescribe (no agrega) para que el cliente no pueda falsear su IP ante el rate limit.
    # Si pones otro proxy delante (Cloudflare, Traefik), cambia esto a $proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
